<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Paulo Henrique Lopes Júnior — AI &amp; Senior Software Engineering Specialist</title>
  <desc id="desc">Software Engineer at Nouvenn IoT, based in Santa Rita do Sapucaí, MG. Building complete solutions across IoT, Backend, Frontend and Cloud, from communication protocols and data models to dashboards and AI in production.</desc>

